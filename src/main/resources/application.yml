spring:
    application:
        name: couponSystem

    h2:
        console:
            enabled: true      # 웹 브라우저에서 DB 관리 도구 사용 여부
            path: /h2-console  # 접속 경로 (기본값: /h2-console)

    datasource:
        driver-class-name: org.h2.Driver
        # 메모리 모드: 서버 종료 시 데이터 초기화
        url: jdbc:h2:mem:testdb
        # 파일 모드: 사용자 홈 디렉토리에 데이터 저장 (비휘발성)
        # url: jdbc:h2:file:~/testdb 
        username: sa
        password: 

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                # H2 2.1.210 버전 이상 사용 시 dialect 명시가 필요할 수 있음
                dialect: org.hibernate.dialect.H2Dialect